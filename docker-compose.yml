services:
  vaultwarden:
    image: vaultwarden/server:1.37.3
    container_name: vaultwarden
    restart: unless-stopped
    ports:
      - "127.0.0.1:8222:80"
    volumes:
      - ./vw-data:/data
    # .env: ADMIN_TOKEN / SMTP only. The Cloudflare DNS token lives in cloudflare.env,
    # read by scripts/cert-renew.sh alone, so it never enters the container.
    env_file: .env
    environment:
      DOMAIN: https://vault-cf.bsvibe.dev
      SIGNUPS_ALLOWED: "false"
      INVITATIONS_ALLOWED: "false"
      WEB_VAULT_ENABLED: "true"
      LOG_FILE: /data/vaultwarden.log
      EXTENDED_LOGGING: "true"
      ROCKET_PORT: "80"
      # Client IP for logs and login rate limiting. Cloudflare sets CF-Connecting-IP on the
      # tunnel path (vault-cf), Caddy overwrites it with the tailnet peer on vault.bsvibe.dev.
      IP_HEADER: CF-Connecting-IP
